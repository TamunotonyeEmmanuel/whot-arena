databases:
  - name: whot-arena-db
    databaseName: whot_arena
    user: whot
    plan: basic-256mb
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: whot-arena-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --ws-max-size 1048576
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: whot-arena-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        sync: false